<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>
    <style>
        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        }
        body {
            font-family: 'Times New Roman', Times, serif;
            background: linear-gradient(to right bottom, #859bff, #d8459d);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        .sidebar {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            width: 280px;
            padding: 16px;
        }
        .sidebar-header {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .toggle-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
        }
        .menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .menu li{
         background: rgba(255, 255, 255, 0.1);
         padding: 12px 16px;
         border-radius: 8px;
         cursor: pointer;
         font-size: 1rem;
         font-weight: bold;
         transition: background 0.2s;
        }
        .menu li:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .hidden {
            display: none;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 16px;
            color: #fff;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
    </head>
    <body>
        <a href="index.html"
    </body>
</html>
